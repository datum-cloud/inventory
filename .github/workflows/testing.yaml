name: testing

on:
  push:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify dependencies
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -timeout 5m ./...
