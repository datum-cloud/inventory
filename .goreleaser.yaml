# GoReleaser config for the datumctl-inventory plugin.
#
# Release a version by pushing a semver tag (vX.Y.Z). The workflow runs
# goreleaser, which builds the plugin and publishes archives + checksums.txt
# to a GitHub release. Installable via `datumctl plugin install datum-cloud/inventory`.
#
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: datumctl-inventory

before:
  hooks:
    - go mod tidy

builds:
  - id: datumctl-inventory
    main: .
    binary: datumctl-inventory
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-X main.version=v{{.Version}}"

archives:
  - id: datumctl-inventory
    # name template makes OS/Arch match `uname` output, matching the convention
    # datumctl's plugin installer expects (datumctl-inventory_Darwin_arm64, ...).
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
